<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - SIAPEL Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="admin-body">

    <!-- Overlay mobile -->
    <div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebar()"></div>

    <!-- ============ SIDEBAR ============ -->
    <aside class="sidebar" id="sidebar">
        <!-- Logo -->
        <div class="sidebar-logo">
            <div class="logo-icon logo-icon--sm">S</div>
            <span class="sidebar-logo-text">
                <span class="sidebar-logo-name">SIAPEL</span>
                <span class="sidebar-logo-sub">Admin Panel</span>
            </span>
        </div>

        <!-- Menu -->
        <nav class="sidebar-nav">
            <a href="../admin/admin-dashboard.html" class="sidebar-link sidebar-link--active">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h4v9H3zM10 3h4v18h-4zM17 8h4v13h-4z" stroke-linecap="round"/></svg>
                Dashboard
            </a>
            <a href="../admin/admin-alumni.html" class="sidebar-link">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20c0-4.1 3.4-7.5 7.5-7.5s7.5 3.4 7.5 7.5" stroke-linecap="round"/></svg>
                Data Alumni
            </a>
        </nav>

        <!-- Bottom -->
        <div class="sidebar-bottom">
            <a href="../index.html" class="sidebar-link">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" stroke-linecap="round"/></svg>
                Kembali ke Situs
            </a>
            <a href=".../login/login.html" class="sidebar-link">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9" stroke-linecap="round"/></svg>
                Keluar
            </a>
        </div>
    </aside>

    <!-- ============ MAIN ============ -->
    <div class="admin-main">

        <!-- Topbar -->
        <header class="admin-topbar">
            <div class="topbar-left">
                <button type="button" class="hamburger-admin" onclick="toggleSidebar()" aria-label="Toggle menu">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16" stroke-linecap="round"/></svg>
                </button>
                <h1 class="admin-page-title">Dashboard</h1>
            </div>
            <div class="topbar-right">
                <span class="topbar-username">Administrator</span>
                <span class="topbar-avatar">A</span>
            </div>
        </header>

        <!-- Flash success message -->
        <div class="flash flash--success" id="flash-success" hidden>
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" stroke-linecap="round"/></svg>
            <span id="flash-msg"></span>
            <button onclick="document.getElementById('flash-success').hidden=true" class="flash-close">&times;</button>
        </div>

        <!-- Content -->
        <main class="admin-content">

            <!-- Statistik -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-card-inner">
                        <span class="stat-card-icon stat-card-icon--yellow">
                            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20c0-4.1 3.4-7.5 7.5-7.5s7.5 3.4 7.5 7.5" stroke-linecap="round"/></svg>
                        </span>
                        <div>
                            <p class="stat-card-label">Total Alumni</p>
                            <p class="stat-card-value" id="dash-total-alumni">...</p>
                        </div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-card-inner">
                        <span class="stat-card-icon stat-card-icon--blue">
                            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6" stroke-linecap="round"/></svg>
                        </span>
                        <div>
                            <p class="stat-card-label">Unit Kerja</p>
                            <p class="stat-card-value" id="dash-total-unit">...</p>
                        </div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-card-inner">
                        <span class="stat-card-icon stat-card-icon--gray">
                            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s7-6.5 7-11.5A7 7 0 0 0 5 9.5C5 14.5 12 21 12 21Z" stroke-linecap="round"/><circle cx="12" cy="9.5" r="2.2"/></svg>
                        </span>
                        <div>
                            <p class="stat-card-label">Provinsi</p>
                            <p class="stat-card-value" id="dash-total-provinsi">...</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Tabel alumni terbaru -->
            <div class="admin-card mt-6">
                <div class="admin-card-header">
                    <h2 class="admin-card-title">Alumni Terbaru</h2>
                    <a href="admin-alumni-form.html" class="btn-add">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg>
                        Tambah Alumni
                    </a>
                </div>

                <div class="tabel-scroll">
                    <table class="tabel tabel--admin">
                        <thead>
                            <tr>
                                <th>Nama</th>
                                <th>NIP</th>
                                <th>Unit Kerja</th>
                                <th>Provinsi</th>
                                <th class="text-right">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="dash-alumni-tbody">
                            <tr><td colspan="5" style="text-align:center;padding:2rem;color:#999">Memuat data...</td></tr>
                        </tbody>
                    </table>
                </div>

                <div class="admin-card-footer">
                    <a href="admin-alumni.html" class="link-semua">Lihat semua alumni →</a>
                </div>
            </div>

        </main>
    </div>

    <script src="../js/api.js"></script>
    <script>
        // ── Sidebar ──────────────────────────────────
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            sidebar.classList.toggle('sidebar--open');
            overlay.classList.toggle('overlay--visible');
        }
        function closeSidebar() {
            document.getElementById('sidebar').classList.remove('sidebar--open');
            document.getElementById('sidebar-overlay').classList.remove('overlay--visible');
        }

        // ── Flash ────────────────────────────────────
        function showFlash(msg) {
            const flash = document.getElementById('flash-success');
            document.getElementById('flash-msg').textContent = msg;
            flash.hidden = false;
            setTimeout(() => flash.hidden = true, 4000);
        }

        // ── Load data dari API ────────────────────────
        (async () => {
            try {
                const data = await fetchAllData();
                const alumni = data.alumni || [];
                const unitList = data.unitKerjaList || [];

                // Update stat cards
                const jumlahProvinsi = new Set(alumni.map(a => a.provinsi).filter(Boolean)).size;
                document.getElementById('dash-total-alumni').textContent   = alumni.length.toLocaleString('id-ID');
                document.getElementById('dash-total-unit').textContent     = unitList.length;
                document.getElementById('dash-total-provinsi').textContent = jumlahProvinsi;

                // Render 5 alumni terbaru (urutan terakhir dari spreadsheet)
                const terbaru = alumni.slice(-5).reverse();
                const tbody   = document.getElementById('dash-alumni-tbody');

                if (terbaru.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:2rem;color:#999">Belum ada data alumni.</td></tr>';
                } else {
                    tbody.innerHTML = terbaru.map(a => `
                        <tr>
                            <td class="font-medium">${a.nama || '-'}</td>
                            <td class="mono text-muted">${a.nip || '-'}</td>
                            <td class="text-muted">${a.unitKerja || '-'}</td>
                            <td class="text-muted">${a.provinsi || '-'}</td>
                            <td>
                                <div class="action-buttons">
                                    <span class="text-muted" style="font-size:.8rem">No. ${a.no || '-'}</span>
                                </div>
                            </td>
                        </tr>
                    `).join('');
                }

            } catch (err) {
                console.error('Dashboard load error:', err);
                document.getElementById('dash-alumni-tbody').innerHTML =
                    '<tr><td colspan="5" style="text-align:center;padding:2rem;color:#e74c3c">Gagal memuat data. Periksa koneksi.</td></tr>';
            }
        })();

        // Cek flash dari halaman form
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('success')) showFlash(decodeURIComponent(urlParams.get('success')));
    </script>
</body>
</html>
