<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login ke akun admin SIAPEL">
    <title>Login - SIAPEL</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

    <div class="login-bg-blob login-bg-blob--1"></div>
    <div class="login-bg-blob login-bg-blob--2"></div>

    <div class="login-container">

        <!-- Logo -->
        <a href="index.html" class="login-logo">
            <div class="logo-icon">
                <img src="img/icon.webp" alt="logo">
            </div>
            <span class="logo-text"><span class="logo-name" style="color:#e67e22;">SIAPEL</span></span>
        </a>

        <!-- Card -->
        <div class="login-card">
            <h1 class="login-title">Masuk ke Akun</h1>
            <p class="login-subtitle">Masuk ke akun menggunakan email dan password.</p>

            <!-- Alert error (hidden by default) -->
            <div class="alert alert--error" id="login-error" hidden>
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4m0 4h.01M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z" stroke-linecap="round"/></svg>
                <span id="login-error-msg">Email atau password salah.</span>
            </div>

            <form id="login-form" class="login-form" onsubmit="handleLogin(event)" novalidate>

                <div class="form-group">
                    <label for="email" class="form-label">Email</label>
                    <input id="email" type="email" name="email" placeholder="nama@email.com"
                        class="form-input" autocomplete="email" required>
                </div>

                <div class="form-group">
                    <div class="form-label-row">
                        <label for="password" class="form-label">Password</label>
                        <a href="#" class="form-link">Lupa password?</a>
                    </div>
                    <div class="input-pw-wrap">
                        <input id="password" type="password" name="password" placeholder="••••••••"
                            class="form-input" autocomplete="current-password" required>
                        <button type="button" class="toggle-pw" onclick="togglePassword()" aria-label="Tampilkan password">
                            <svg id="pw-show-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
                            <svg id="pw-hide-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" hidden><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                        </button>
                    </div>
                </div>

                <button type="submit" id="btn-submit" class="btn-login-submit">
                    <span id="btn-text">Masuk</span>
                    <span id="btn-spinner" class="spinner" hidden></span>
                </button>
            </form>

            <p class="login-note">Akun demo: <strong>admin@siapel.go.id</strong> / <strong>password123</strong></p>
        </div>

        <a href="index.html" class="login-back">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="m19 12-7-7-7 7M12 5v14" stroke-linecap="round"/></svg>
            Kembali ke Beranda
        </a>
    </div>

    <script>
        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errEl = document.getElementById('login-error');
            const errMsg = document.getElementById('login-error-msg');
            const btnText = document.getElementById('btn-text');
            const btnSpinner = document.getElementById('btn-spinner');

            errEl.hidden = true;
            btnText.hidden = true;
            btnSpinner.hidden = false;

            // Simulasi loading
            setTimeout(() => {
                btnText.hidden = false;
                btnSpinner.hidden = true;

                // Akun demo
                if (email === 'admin@siapel' && password === '123') {
                    window.location.href = 'admin-dashboard.html';
                } else {
                    errMsg.textContent = 'Email atau password salah. Coba: admin@siapel.go.id / password123';
                    errEl.hidden = false;
                }
            }, 1000);
        }

        function togglePassword() {
            const input = document.getElementById('password');
            const showIcon = document.getElementById('pw-show-icon');
            const hideIcon = document.getElementById('pw-hide-icon');
            if (input.type === 'password') {
                input.type = 'text';
                showIcon.hidden = true;
                hideIcon.hidden = false;
            } else {
                input.type = 'password';
                showIcon.hidden = false;
                hideIcon.hidden = true;
            }
        }
    </script>
</body>
</html>
